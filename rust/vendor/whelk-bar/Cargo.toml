# whelk-bar -- a bar surface for GTK4 Wayland shells
#
# SPDX-License-Identifier: MIT
# Copyright © Josep Bigorra <jjbigorra@gmail.com>

[package]
name = "whelk-bar"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "A bar surface for GTK4 Wayland shells, split out of WheLK"
publish = false

[lib]
name = "whelk_bar"
path = "src/lib.rs"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_18"] }
gio = { version = "0.22", features = ["v2_80"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
