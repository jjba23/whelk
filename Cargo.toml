# The workspace: the Rust shell, and `xtask` -- the jobs cargo does not do on its
# own (staging an install and writing the source archive).  This is the only
# build; the C shell and its Meson build are gone.
[workspace]
members = ["rust", "xtask"]
resolver = "2"

# One codegen unit per module, so a test that only calls a decision function
# does not drag the widget code (and GTK) into its link.  Profiles belong to the
# workspace, not to a member.
[profile.release]
codegen-units = 256
